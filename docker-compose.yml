services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umockme
      POSTGRES_USER: umockme
      POSTGRES_PASSWORD: umockme
    ports:
      - "5432:5432"
    volumes:
      - umockme-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umockme -d umockme"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - umockme-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  umockme-postgres:
  umockme-redis: